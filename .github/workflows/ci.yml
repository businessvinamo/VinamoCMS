name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen prüfen
        run: npm run typecheck
      - name: Bauen
        run: npm run build

  mandantentrennung:
    runs-on: ubuntu-latest
    # Läuft gegen die Staging-Datenbank und legt dabei eigene Mandanten an, die
    # am Ende wieder verschwinden. Ohne die Secrets wird der Job übersprungen --
    # in einem Fork gibt es sie nicht, und ein roter Fork-Build hilft niemandem.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolationstest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:isolation
